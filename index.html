<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Moon Palace Secret</title>


<style>

* {
  box-sizing: border-box;
}


html,
body {

  margin: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #050711;

}


body {

  display: flex;

  justify-content: center;

  align-items: center;

}


/* =========================
   9:16 GAME SCREEN
   ========================= */

#game {

  position: relative;

  width: min(100vw, 56.25vh);

  height: min(177.78vw, 100vh);

  aspect-ratio: 9 / 16;

  overflow: hidden;

  touch-action: none;

  user-select: none;


  background-image:
    url("moon-palace-key.png");

  background-size: cover;

  background-position: center;

  background-repeat: no-repeat;

}



/* =========================
   DARKNESS
   ========================= */

#darkness {

  position: absolute;

  left: 0;
  top: 0;

  width: 100%;
  height: 100%;

  z-index: 2;

  pointer-events: none;

}



/* =========================
   TORCH LIGHT RING
   ========================= */

#torchRing {

  position: absolute;

  width: 144px;
  height: 144px;

  border-radius: 50%;

  border:
    2px solid rgba(255,240,170,0.7);

  box-shadow:

    0 0 15px
    rgba(255,230,130,.7),

    inset 0 0 18px
    rgba(255,240,180,.35);


  transform:
    translate(-50%, -50%);

  pointer-events: none;

  display: none;

  z-index: 3;

}



/* =========================
   STARTING LANTERN
   ========================= */

#startHint {

  position: absolute;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%, -50%);

  z-index: 5;

  text-align: center;

  color: #fff4c2;

  font-family:
    Arial, sans-serif;

  pointer-events: none;

}



/* Lantern */

.moonLantern {

  position: relative;

  width: 48px;
  height: 72px;

  margin:
    0 auto 14px;

  animation:
    lanternPulse
    1.5s
    ease-in-out
    infinite;

}



/* Lantern top */

.lanternTop {

  position: absolute;

  width: 30px;
  height: 7px;

  left: 9px;
  top: 4px;

  border-radius: 5px;

  background: #e6b84a;

  box-shadow:
    0 0 8px #ffd96b;

}



/* Lantern glowing body */

.lanternBody {

  position: absolute;

  width: 42px;
  height: 46px;

  left: 3px;
  top: 11px;

  border-radius:
    12px 12px 16px 16px;

  border:
    2px solid #ffd96b;

  background:

    radial-gradient(

      circle,

      #fff5ae 0%,

      #ffd95d 40%,

      #e69a32 100%

    );


  box-shadow:

    0 0 12px #ffd96b,

    0 0 28px
    rgba(255,210,90,.75),

    0 0 50px
    rgba(255,190,70,.35);

}



/* Lantern tassel */

.lanternTail {

  position: absolute;

  width: 4px;
  height: 14px;

  left: 22px;
  top: 57px;

  background: #e3a638;

  border-radius: 3px;

}



/* Instruction below lantern */

.hintText {

  font-size: 15px;

  font-weight: 600;

  letter-spacing: .3px;

  text-shadow:

    0 2px 5px #000,

    0 0 8px
    rgba(255,220,120,.4);

}


/* Lantern breathing animation */

@keyframes lanternPulse {

  0%,
  100% {

    transform:
      scale(1);

    filter:
      brightness(.9);

  }


  50% {

    transform:
      scale(1.12);

    filter:
      brightness(1.25);

  }

}

</style>

</head>



<body>


<div id="game">


  <!-- Black darkness layer -->

  <canvas id="darkness"></canvas>



  <!-- Actual movable torch circle -->

  <div id="torchRing"></div>



  <!-- Starting hint -->

  <div id="startHint">


    <div class="moonLantern">

      <div class="lanternTop"></div>

      <div class="lanternBody"></div>

      <div class="lanternTail"></div>

    </div>


    <div class="hintText">

      Drag the light to uncover the secret code

    </div>


  </div>


</div>



<script>


const game =
document.getElementById("game");


const canvas =
document.getElementById("darkness");


const ctx =
canvas.getContext("2d");


const torchRing =
document.getElementById("torchRing");


const startHint =
document.getElementById("startHint");


let dragging = false;


let gameStarted = false;



/* =========================
   FIT CANVAS TO GAME
   ========================= */

function resizeCanvas() {


  canvas.width =
    game.clientWidth;


  canvas.height =
    game.clientHeight;


  drawDarkness();

}



/* =========================
   CREATE DARKNESS
   AND TORCH HOLE
   ========================= */

function drawDarkness(x, y) {


  ctx.globalCompositeOperation =
    "source-over";


  ctx.clearRect(

    0,
    0,

    canvas.width,
    canvas.height

  );



  /* Dark cover */


  ctx.fillStyle =
    "rgba(1,3,12,0.96)";


  ctx.fillRect(

    0,
    0,

    canvas.width,
    canvas.height

  );



  /* No torch location yet */


  if (

    x === undefined ||
    y === undefined

  ) {

    return;

  }



  /* Cut torchlight hole */


  ctx.globalCompositeOperation =
    "destination-out";



  const radius = 72;



  const gradient =
    ctx.createRadialGradient(

      x,
      y,
      12,

      x,
      y,
      radius

    );



  gradient.addColorStop(

    0,
    "rgba(0,0,0,1)"

  );



  gradient.addColorStop(

    0.65,
    "rgba(0,0,0,0.95)"

  );



  gradient.addColorStop(

    1,
    "rgba(0,0,0,0)"

  );



  ctx.fillStyle =
    gradient;



  ctx.beginPath();



  ctx.arc(

    x,
    y,

    radius,

    0,

    Math.PI * 2

  );



  ctx.fill();



  ctx.globalCompositeOperation =
    "source-over";

}



/* =========================
   MOVE TORCH
   ========================= */

function moveTorch(event) {


  if (!dragging) {

    return;

  }



  const rect =
    game.getBoundingClientRect();



  const x =
    event.clientX -
    rect.left;



  const y =
    event.clientY -
    rect.top;



  torchRing.style.left =
    x + "px";


  torchRing.style.top =
    y + "px";



  drawDarkness(x, y);

}



/* =========================
   PLAYER TOUCHES SCREEN
   ========================= */

game.addEventListener(

  "pointerdown",

  function(event) {


    dragging = true;



    /* Hide lantern after first touch */


    if (!gameStarted) {


      gameStarted = true;


      startHint.style.display =
        "none";

    }



    torchRing.style.display =
      "block";



    game.setPointerCapture(
      event.pointerId
    );



    moveTorch(event);

  }

);



/* Player moves finger */

game.addEventListener(

  "pointermove",

  moveTorch

);



/* Player releases finger */

game.addEventListener(

  "pointerup",

  function() {


    dragging = false;


    torchRing.style.display =
      "none";


    drawDarkness();

  }

);



game.addEventListener(

  "pointercancel",

  function() {


    dragging = false;


    torchRing.style.display =
      "none";


    drawDarkness();

  }

);



window.addEventListener(

  "resize",

  resizeCanvas

);



resizeCanvas();


</script>


</body>

</html>
